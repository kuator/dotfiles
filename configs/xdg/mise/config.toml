[tools]
node = "20.20.2"
go = "1.21"
java = "22"
deno = "latest"
rust = "stable"
uv = "latest"
ty = "latest"
bat = "latest"
eza = "latest"
delta = "latest"
bottom = "latest"
lazygit = "latest"
lazydocker = "latest"
shfmt = "latest"
k9s = "latest"
atuin = "latest"
"github:zk-org/zk" = "latest"
"github:ewhauser/shuck" = { version = "latest", matching = "shuck-cli" }
bob = "latest"
"github:jtroo/kanata" = { version = "latest", asset_pattern = "linux-binaries-x64.zip", rename_exe = { kanata_linux_x64 = "kanata" }, filter_bins = "kanata" }
"cargo:presse" = "latest"
"github:neovide/neovide" = { version = "latest", matching_regex = '^neovide-linux-x86_64\.tar(\.gz)?$' }

[settings]
idiomatic_version_file_enable_tools = []
